<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>En El Músculo Nutrición</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">

<link rel="icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="isak.js"></script>

<style>
/* Layout: barra superior fija con la marca; listas de clientes en tarjetas; el editor de planes usa
   dos columnas en escritorio (comidas a la izquierda, resumen del día fijo a la derecha) y una en el celular. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#0e1a2b; --muted:#5b6b7f; --line:#d6dfea;
  --brand:#0d4f9c; --brand-2:#1b9be0; --brand-ink:#ffffff; --brand-soft:#e3eefa;
  --bar:#0a2f5c; --bar-ink:#eaf3ff; --bar-muted:#9fc2ea;
  --ok:#157a48; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fff1d6; --bad:#b4231f; --bad-soft:#fde3e1;
  --abs-r:#c2410c; --abs-m:#8a6a00; --abs-l:#1f7a3a;
  --mp:#0d4f9c; --mc:#d9480f; --mg:#b08800;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111c; --surface:#101b2a; --surface-2:#0c1623; --ink:#e6eef8; --muted:#9aaec5; --line:#223349;
  --brand:#4ea9f2; --brand-2:#7cc8f8; --brand-ink:#04101d; --brand-soft:#132c47;
  --bar:#061424; --bar-ink:#e6f1ff; --bar-muted:#7fa6d3;
  --ok:#5fd39a; --ok-soft:#10301f; --warn:#f2b44a; --warn-soft:#33260c; --bad:#ff8a80; --bad-soft:#3a1513;
  --abs-r:#ff9b62; --abs-m:#e6c24a; --abs-l:#6fd68c;
  --mp:#4ea9f2; --mc:#ff8f5a; --mg:#e6c24a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111c; --surface:#101b2a; --surface-2:#0c1623; --ink:#e6eef8; --muted:#9aaec5; --line:#223349;
  --brand:#4ea9f2; --brand-2:#7cc8f8; --brand-ink:#04101d; --brand-soft:#132c47;
  --bar:#061424; --bar-ink:#e6f1ff; --bar-muted:#7fa6d3;
  --ok:#5fd39a; --ok-soft:#10301f; --warn:#f2b44a; --warn-soft:#33260c; --bad:#ff8a80; --bad-soft:#3a1513;
  --abs-r:#ff9b62; --abs-m:#e6c24a; --abs-l:#6fd68c;
  --mp:#4ea9f2; --mc:#ff8f5a; --mg:#e6c24a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.brand img{width:44px;height:auto}
.brand b{font-family:var(--display);font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bar-muted);text-align:left}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{background:none;border:0;color:var(--bar-muted);padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--bar-ink);background:rgba(255,255,255,.1)}
main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
h1{font-size:1.9rem;text-transform:uppercase}
h2{font-size:1.35rem;text-transform:uppercase}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel.flat{background:var(--surface-2)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--brand)}
.card .name{font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}
.btn.icon{min-width:34px;padding:4px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
label.f > span{letter-spacing:.02em}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=time],input[type=search],input[type=email],input[type=password],input[type=url],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;color:var(--ink);font-weight:500;min-width:0}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.pill.ghost{border-color:var(--line);color:var(--muted)}
.abs{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.abs.R{color:var(--abs-r)} .abs.M{color:var(--abs-m)} .abs.L{color:var(--abs-l)}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
td.n,th.n{text-align:right}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1}
.stat .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.banner{border-radius:10px;padding:10px 12px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.info{background:var(--brand-soft);color:var(--brand)} .banner.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
/* Editor de plan */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:12px}
@media (max-width:980px){.editor{grid-template-columns:1fr}.side{position:static}}
.meal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;min-width:0}
.meal-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h input.mname{font-family:var(--display);font-size:1.2rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;max-width:220px;background:transparent;border-color:transparent}
.meal-h input.mname:hover,.meal-h input.mname:focus{border-color:var(--line);background:var(--surface-2)}
.meal-h input[type=time]{width:auto}
.meal-b{padding:6px 14px 12px;display:grid;gap:10px;min-width:0}
.target{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tbar{display:grid;gap:3px;font-size:.8rem}
.tbar .track{height:6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.tbar .fill{height:100%}
.items td{padding:5px 6px}
.items input[type=number]{width:76px;text-align:right;padding:6px}
.items select{width:auto;padding:5px;min-height:32px}
.fname{font-weight:600}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.mtot td{font-weight:700;border-bottom:0}
.eqv{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 12px;font-size:.9rem}
.kv b{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:50;display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(760px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.modal-c{padding:12px 16px;overflow:auto;display:grid;gap:10px;align-content:start}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.flist{display:grid;gap:4px}
.fopt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;width:100%}
.fopt:hover{background:var(--surface-2);border-color:var(--line)}
.fopt:disabled{cursor:not-allowed;opacity:.55}
.fopt .meta{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.chart svg{width:100%;height:auto;display:block}
.sup-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface-2)}
.prod{display:flex;gap:10px;align-items:center}
.prod img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.savestate{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){h1{font-size:1.5rem}.brand small{display:none}.meal-h input.mname{max-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function nafOpts(...extra){
  const o = NAF.map(([v,l])=>[v,`${v} · ${l}`]);
  for (const [v,l] of extra) if (v && !o.some(x=>Math.abs(x[0]-v)<1e-9)) o.push([v,`${(+v).toFixed(2)} · ${l}`]);

}

const r0 = n => Math.round(n); const r1 = n => Math.round(n*10)/10;
const fmt = (n, d=0) => (n==null || isNaN(n)) ? "–" : Number(n).toLocaleString("es-VE",{minimumFractionDigits:d,maximumFractionDigits:d});
const newId = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const fdate = s => { if(!s) return ""; const [y,m,d] = s.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const tmin = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+(m||0); };
const mtime = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const digits = s => String(s||"").replace(/\D/g,"").slice(-10);
const clone = o => JSON.parse(JSON.stringify(o));
function edadDe(nac){ if(!nac) return null; const d=new Date(nac), n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())) a--; return a; }
function toast(msg, ms=2600){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(), ms); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ================= ALMACENAMIENTO (SUPABASE) ================= */
const CFG = window.EEM_CONFIG || {};
const CONFIGURADO = !!(CFG.supabaseUrl && !/PEGA_AQUI/.test(CFG.supabaseUrl) && CFG.supabaseAnonKey && !/PEGA_AQUI/.test(CFG.supabaseAnonKey));
const sb = (CONFIGURADO && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true}}) : null;
const DB = {clientes:new Map(), controles:new Map(), planes:new Map(), plantillas:new Map(), config:new Map()};
const VER = new Map();       // "coleccion|id" -> versión (actualizado) que conoce este dispositivo
const PEND = new Map();      // guardados que fallaron y se reintentan
const INFLIGHT = new Set();  // guardados en curso (sus ecos en vivo se ignoran)
const LOADED = new Set();    // clientes con planes y controles ya descargados
const CONFLICTO = new Set(); // documentos esperando que el entrenador elija versión
let chain = Promise.resolve();
const kk = (c, i) => c + "|" + i;
function refreshLists(){
  S.clientes = [...DB.clientes.values()];
  S.plantillas = [...DB.plantillas.values()];
  S.controles = [...DB.controles.values()].filter(x=>x.clienteId===S.clienteId);
  S.planes = [...DB.planes.values()].filter(x=>x.clienteId===S.clienteId);
  const cfg = DB.config.get("general");
  if (cfg){ S.config = clone(cfg); S.config.etiquetas ||= {}; buildFoods(); }
}
function marcarSync(ts){ if (ts && (!S.lastSync || ts > S.lastSync)) S.lastSync = ts; }
function filaDe(col, data){ return {coleccion:col, id:data.id, cliente_id:data.clienteId || (col==="clientes" ? data.id : null), data:clone(data)}; }
async function escribir(col, data){
  const key = kk(col, data.id), prev = VER.get(key), row = filaDe(col, data);
  if (prev){
    const {data:res, error} = await sb.from("registros").update({data:row.data, cliente_id:row.cliente_id}).match({coleccion:col, id:data.id}).eq("actualizado", prev).select("actualizado");
    if (error) throw error;
    if (!res || !res.length) return "conflicto";
    VER.set(key, res[0].actualizado); marcarSync(res[0].actualizado); return "ok";
  }
  const {data:res, error} = await sb.from("registros").insert(row).select("actualizado");
  if (error){ if (error.code==="23505" || /duplicate key/i.test(error.message||"")) return "conflicto"; throw error; }
  if (res && res[0]){ VER.set(key, res[0].actualizado); marcarSync(res[0].actualizado); }
  return "ok";
}
async function resolverConflicto(col, data){
  const key = kk(col, data.id);
  const {data:rows, error} = await sb.from("registros").select("data,actualizado").match({coleccion:col, id:data.id});
  if (error) throw error;
  const srv = rows && rows[0];
  if (!srv){ VER.delete(key); return escribir(col, data); }
  if (col==="planes" && S.plan && S.plan.id===data.id){
    CONFLICTO.add(key); S.conflicto = {key, srv};
    modal(`<div class="modal" role="dialog" aria-modal="true" style="width:min(520px,100%)"><div class="modal-c"><h2>Este plan cambió en otro dispositivo</h2>
      <p style="margin:0">Mientras lo editabas aquí, se guardó otra versión desde tu otro dispositivo. ¿Cuál quieres conservar?</p></div>
      <div class="modal-f"><button class="btn" data-act="conf-remoto">Cargar la otra versión</button><button class="btn primary" data-act="conf-mio">Guardar la mía encima</button></div></div>`);
    return "conflicto";
  }
  VER.set(key, srv.actualizado);           // fichas, controles, plantillas: gana el cambio que acabas de hacer
  return escribir(col, data);
}
async function guardarRemoto(col, data){
  const key = kk(col, data.id);
  if (CONFLICTO.has(key)) return "conflicto";
  INFLIGHT.add(key);
  try {
    let r = await escribir(col, data);
    if (r==="conflicto") r = await resolverConflicto(col, data);
    PEND.delete(key); return r;
  } catch (e) { PEND.set(key, {col, data:clone(data)}); handleDbErr(e); return "error"; }
  finally { INFLIGHT.delete(key); }
}
function saveDoc(col, data){
  DB[col].set(data.id, clone(data)); refreshLists();
  if (!sb || !S.user) return Promise.resolve("ok");
  const snap = clone(data);
  const p = chain.then(() => guardarRemoto(col, snap));
  chain = p.catch(()=>{});
  return p;
}
function delDoc(col, id){
  DB[col].delete(id); refreshLists(); const key = kk(col, id); PEND.delete(key);
  if (!sb || !S.user) return Promise.resolve();
  const p = chain.then(async () => { const {error} = await sb.from("registros").delete().match({coleccion:col, id}); if (error) throw error; VER.delete(key); }).catch(handleDbErr);
  chain = p; return p;
}
let reintentando = false;
async function reintentar(){
  if (!sb || !S.user || reintentando || !PEND.size) return; reintentando = true;
  for (const [key, {col, data}] of [...PEND]){ PEND.delete(key); await saveDoc(col, DB[col].get(data.id) || data); }
  reintentando = false;
  if (!PEND.size && S.saveState==="error"){ S.saveState = "ok"; updSave(); toast("Cambios pendientes guardados"); }
}
function handleDbErr(e){
  console.error(e);
  const msg = String(e?.message||"");
  if (/JWT|expired|401/i.test(msg)) toast("Tu sesión venció. Sal y vuelve a entrar; tus cambios siguen pendientes.", 6000);
  else if (/row-level security|permission/i.test(msg)) toast("Tu correo no está registrado como entrenador en la base de datos.", 6000);
  else if (/Failed to fetch|NetworkError|network|Load failed/i.test(msg)) toast("Sin conexión. Lo guardo solo cuando vuelva el internet.", 5000);
  else toast("No se pudo guardar: " + msg.slice(0,120) + ". Lo reintento en un momento.", 5000);
  S.saveState = "error"; updSave();
}
function saveConfig(){ saveDoc("config", {id:"general", ...clone(S.config)}); }
function saveCatalog(){ try { localStorage.setItem("eem-catalogo", JSON.stringify(S.catalogo)); } catch {} }
function aplicarFila(r){ if (!DB[r.coleccion]) return; DB[r.coleccion].set(r.id, r.data); VER.set(kk(r.coleccion, r.id), r.actualizado); marcarSync(r.actualizado); }
async function leerPaginas(q){
  const out = []; let from = 0; const page = 1000;
  for (;;){ const {data, error} = await q().range(from, from+page-1); if (error) throw error; out.push(...data); if (data.length < page) break; from += page; }
  return out;
}
async function cargarTodo(){
  for (const k in DB) DB[k].clear(); VER.clear(); LOADED.clear(); S.lastSync = null;
  const rows = await leerPaginas(() => sb.from("registros").select("coleccion,id,data,actualizado").in("coleccion", ["clientes","plantillas","config"]).order("coleccion").order("id"));
  rows.forEach(aplicarFila); refreshLists();
}
async function cargarCliente(id){
  if (!sb || !S.user || LOADED.has(id)) return;
  const rows = await leerPaginas(() => sb.from("registros").select("coleccion,id,data,actualizado").eq("cliente_id", id).in("coleccion", ["planes","controles"]).order("coleccion").order("id"));
  rows.forEach(r => { if (!INFLIGHT.has(kk(r.coleccion, r.id))) aplicarFila(r); });
  LOADED.add(id); refreshLists();
}
const renderPronto = debounce(() => { if (S.view!=="plan") render(); }, 250);
function afectaVista(col, cid){
  if (S.view==="clientes") return col==="clientes";
  if (S.view==="cliente") return cid===S.clienteId || (col==="clientes" && cid===S.clienteId);
  if (S.view==="plantillas") return col==="plantillas";
  if (S.view==="proteinas") return col==="config";
  return false;
}
function editandoCampo(){ const a = document.activeElement; return !!(a && a.closest && a.closest("#app") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function recibirRemoto(r, borrado){
  const key = kk(r.coleccion, r.id);
  if (INFLIGHT.has(key)) return;
  if (borrado){
    if (!DB[r.coleccion] || !DB[r.coleccion].has(r.id)) return;
    const cid = DB[r.coleccion].get(r.id)?.clienteId || (r.coleccion==="clientes" ? r.id : null);
    DB[r.coleccion].delete(r.id); VER.delete(key); refreshLists();
    if (afectaVista(r.coleccion, cid)) renderPronto(); return;
  }
  if (VER.get(key) === r.actualizado) return;                                  // eco de un guardado propio
  if ((r.coleccion==="planes" || r.coleccion==="controles") && !LOADED.has(r.cliente_id)) return;
  if (r.coleccion==="planes" && S.view==="plan" && S.plan && S.plan.id===r.id){
    if (S.planDirty){ toast("Este plan se cambió en otro dispositivo. Al guardar te preguntaré qué versión conservar.", 5000); return; }
    aplicarFila(r); S.plan = clone(r.data); refreshLists(); render(); toast("Plan actualizado desde tu otro dispositivo"); return;
  }
  aplicarFila(r); refreshLists();
  if (afectaVista(r.coleccion, r.cliente_id || r.data?.clienteId || (r.coleccion==="clientes" ? r.id : null))){
    if (S.view==="cliente" && editandoCampo()) { S.remotoPendiente = true; return; }
    renderPronto();
  }
}
function suscribirCambios(){
  sb.channel("eem-cambios")
    .on("postgres_changes", {event:"*", schema:"public", table:"registros"}, pl => {
      if (pl.eventType==="DELETE") recibirRemoto(pl.old || {}, true);
      else if (pl.new && pl.new.coleccion) recibirRemoto(pl.new, false);
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"entrevistas"}, () => procesarEntrevistas())
    .subscribe(st => { if (st==="SUBSCRIBED") sincronizar(); });
}
async function sincronizar(){
  if (!sb || !S.user || !S.lastSync) return;
  try {
    const rows = await leerPaginas(() => sb.from("registros").select("coleccion,id,cliente_id,data,actualizado").gt("actualizado", S.lastSync).order("actualizado"));
    rows.forEach(r => recibirRemoto(r, false));
  } catch (e) { console.error(e); }
}
function openClientSubs(id){
  S.clienteId = id; refreshLists();
  if (!LOADED.has(id) && sb && S.user){ S.cargandoCliente = true; cargarCliente(id).catch(console.error).finally(()=>{ S.cargandoCliente = false; if (S.clienteId===id && S.view!=="plan") render(); }); }
}

/* PDFs ISAK: se guarda solo el del control más reciente de cada cliente */
async function borrarPDFs(paths){
  paths = [...new Set(paths.filter(Boolean))]; if (!sb || !paths.length) return;
  try { await sb.storage.from("isak").remove(paths); } catch (e) { console.error(e); }
}
async function dejarSoloUltimoPDF(clienteId){
  const ks = [...DB.controles.values()].filter(k=>k.clienteId===clienteId && k.pdfPath)
    .sort((a,b)=> b.fecha.localeCompare(a.fecha) || String(b.subido||"").localeCompare(String(a.subido||"")));
  const viejos = ks.slice(1); if (!viejos.length) return;
  await borrarPDFs(viejos.map(k=>k.pdfPath));
  for (const k of viejos) await saveDoc("controles", {...k, pdfPath:null, pdfBorrado:true});
}
async function subirPDF(file, clienteId){
  if (!sb) return null;
  const path = `controles/${clienteId}/${Date.now()}.pdf`;
  const {error} = await sb.storage.from("isak").upload(path, file, {contentType:"application/pdf", upsert:false});
  if (error){ console.error(error); toast("No se pudo guardar el PDF. Los valores del control sí se guardan."); return null; }
  return path;
}

/* Entrevistas que llegan del formulario: crean o actualizan el cliente solas */
let procesando = false; const FALLOS = new Map();
async function procesarEntrevistas(){
  if (!sb || !S.user || procesando) return; procesando = true;
  let hubo = false;
  try {
    const {data, error} = await sb.from("entrevistas").select("*").eq("procesada", false).order("creado").limit(50);
    if (error) throw error;
    for (const e of data){
      if ((FALLOS.get(e.id)||0) >= 3) continue;
      try {
        const {data:tomada, error:ce} = await sb.from("entrevistas").update({procesada:true}).eq("id", e.id).eq("procesada", false).select("id");
        if (ce) throw ce;
        if (!tomada || !tomada.length) continue;                      // otro dispositivo ya la tomó
        let c;
        try { c = await aplicarEntrevista(sanearEntrevista(e.datos), sanearIsak(e.isak), e.pdf_path, e.creado, undefined, e.id); }
        catch (err) { await sb.from("entrevistas").update({procesada:false}).eq("id", e.id); throw err; }
        const {error:ue} = await sb.from("entrevistas").update({cliente_id:c.id}).eq("id", e.id);
        if (ue) console.error(ue);
        hubo = true;
        S.recibidas.unshift({nombre:c.nombre, id:c.id, cuando:e.creado, isak:!!(e.isak && e.isak.valido), pdf:!!e.pdf_path});
        toast(`Nueva entrevista: ${c.nombre}${e.isak && e.isak.valido ? " (con medidas ISAK)" : ""}`, 5000);
      } catch (err) { console.error("entrevista", e.id, err); FALLOS.set(e.id, (FALLOS.get(e.id)||0)+1); }
    }
  } catch (e) { console.error(e); }
  procesando = false;
  if (hubo && S.view!=="plan") render();
}
async function cargarRecibidas(){
  if (!sb) return;
  const {data} = await sb.from("entrevistas").select("id,creado,datos->>nombre,cliente_id,pdf_path,isak->>valido").order("creado", {ascending:false}).limit(8);
  if (data) S.recibidas = data.map(r=>({nombre:r.nombre, id:r.cliente_id, cuando:r.creado, isak:r.valido==="true", pdf:!!r.pdf_path}));
}
async function abrirPDF(path){
  if (!sb || !path) return;
  const w = window.open("", "_blank");
  const {data, error} = await sb.storage.from("isak").createSignedUrl(path, 600);
  if (error || !data){ if (w) w.close(); toast("No se pudo abrir el PDF."); return; }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

/* Validación de lo que llega del formulario público */
const S_ = (v, n=200) => typeof v==="string" ? v.slice(0,n).trim() : (typeof v==="number" && isFinite(v) ? String(v) : "");
const N_ = (v, a, b) => { const x = parseFloat(v); return isFinite(x) && x>=a && x<=b ? x : ""; };
const H_ = v => typeof v==="string" && /^\d{2}:\d{2}$/.test(v) ? v : "";
const D_ = v => typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : "";
const A_ = (v, ok, max=300) => Array.isArray(v) ? [...new Set(v.filter(x => typeof x==="string" && x.length<100 && (!ok || ok(x))))].slice(0, max) : [];
function sanearEntrevista(d){
  d = (d && typeof d==="object" && !Array.isArray(d)) ? d : {};
  const act = {}; if (d.actividad && typeof d.actividad==="object") for (const k of Object.keys(ACT_LBL)) { const v = N_(d.actividad[k], 0, 24); if (v!=="") act[k] = v; }
  return {
    fecha:D_(d.fecha), nombre:S_(d.nombre,80) || "Cliente sin nombre", telefono:S_(d.telefono,30), nacimiento:D_(d.nacimiento),
    sexo:["Femenino","Masculino"].includes(d.sexo) ? d.sexo : "", estatura:N_(d.estatura,90,240), peso:N_(d.peso,25,300), objetivo:S_(d.objetivo,40),
    dias:N_(d.dias,0,7), horaEntreno:H_(d.horaEntreno), duracion:N_(d.duracion,15,300), tipoEntreno:A_(d.tipoEntreno,null,10),
    oficio:S_(d.oficio,80), actividad:act, pal:N_(d.pal,1,2.6), getEst:N_(d.getEst,500,8000), nivelAct:S_(d.nivelAct,40), horasEntrenoDia:N_(d.horasEntrenoDia,0,12),
    despertar:H_(d.despertar), dormir:H_(d.dormir), comidas:N_(d.comidas,2,8), dondeCome:A_(d.dondeCome,null,10), cocina:S_(d.cocina,20),
    alergias:A_(d.alergias, x => Object.hasOwn(ALERG, x)), dieta:Object.hasOwn(DIETAS, d.dieta) ? d.dieta : "omnivoro", otrasAlergias:S_(d.otrasAlergias),
    noMeGusta:A_(d.noMeGusta, x => !!F[x]), condiciones:A_(d.condiciones,null,20), otraCondicion:S_(d.otraCondicion), medicamentos:S_(d.medicamentos),
    suplementos:S_(d.suplementos), agua:S_(d.agua,30), alcohol:S_(d.alcohol,30), listaCompras:d.listaCompras===true, comentarios:S_(d.comentarios,1000)
  };
}
const ISAK_NUM = ["peso","talla","tallaSentado","envergadura","masaGrasa","grasaPct","masaLibre","masaMusc","masaMuscPct","masaOsea","tejAdiposo","sum6","sum8","endo","meso","ecto","imc","icc","ict","iam","imo","brazoCorr","musloCorr","piernaCorr","edad"];
function sanearIsak(i){
  if (!i || typeof i!=="object" || Array.isArray(i)) return null;
  const o = {pliegues:{}, perimetros:{}, diametros:{}, origen:"ISAKMetry"};
  for (const k of ISAK_NUM){ const v = N_(i[k], -50, 500); if (v!=="") o[k] = v; }
  for (const [g, list] of [["pliegues", ISAK_PL], ["perimetros", ISAK_PE], ["diametros", ISAK_DI]])
    if (i[g] && typeof i[g]==="object") for (const [k] of list){ const v = N_(i[g][k], 0, 300); if (v!=="") o[g][k] = v; }
  o.fecha = D_(i.fecha); o.nombre = S_(i.nombre,80); o.evaluador = S_(i.evaluador,80); o.sexo = ["Femenino","Masculino"].includes(i.sexo) ? i.sexo : "";
  o.valido = !!(o.peso && Object.keys(o.pliegues).length + Object.keys(o.perimetros).length >= 5);
  return o;
}

/* ================= TIENDA (SHOPIFY STOREFRONT API) ================= */
const SHOP_OK = !!(CFG.shopifyStorefrontToken && !/PEGA_AQUI/.test(CFG.shopifyStorefrontToken) && CFG.shopifyDominio);
function gidNum(g){ return String(g||"").split("/").pop(); }
async function shopQuery(query, variables){
  const url = `https://${CFG.shopifyDominio}/api/${CFG.shopifyApiVersion||"2026-07"}/graphql.json`;
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json","X-Shopify-Storefront-Access-Token":CFG.shopifyStorefrontToken}, body:JSON.stringify({query, variables})});
  if (r.status===401 || r.status===403) throw {code:"token"};
  if (!r.ok) throw {code:"http", status:r.status};
  return r.json();
}
const Q_FULL = `query($c:String){products(first:100,after:$c,sortKey:TITLE){pageInfo{hasNextPage endCursor}edges{node{id title handle productType vendor description availableForSale totalInventory featuredImage{url} priceRange{minVariantPrice{amount}} variants(first:50){edges{node{id title availableForSale quantityAvailable price{amount}}}}}}}}`;
const Q_BASIC = `query($c:String){products(first:100,after:$c,sortKey:TITLE){pageInfo{hasNextPage endCursor}edges{node{id title handle productType vendor description availableForSale featuredImage{url} priceRange{minVariantPrice{amount}} variants(first:50){edges{node{id title availableForSale price{amount}}}}}}}}`;
async function loadCatalog(force){
  if (!SHOP_OK){ S.catStatus = "sin-conexion"; renderIfStore(); return; }
  S.catStatus = "cargando"; S.catError = null; renderIfStore();
  try {
    let q = Q_FULL, qty = true, after = null, items = [], guard = 0;
    do {
      let res = await shopQuery(q, {c:after});
      if (res.errors && qty){ q = Q_BASIC; qty = false; res = await shopQuery(q, {c:after}); }
      if (res.errors) throw {code:"graphql", msg:res.errors[0]?.message};
      const prods = res.data.products;
      for (const {node:n} of prods.edges){
        const variants = n.variants.edges.map(({node:v})=>({id:gidNum(v.id), title:v.title, price:v.price?.amount, inv: qty ? Math.max(0, v.quantityAvailable ?? 0) : (v.availableForSale ? 1 : 0)}));
        items.push({id:gidNum(n.id), title:n.title, handle:n.handle, type:n.productType||"", vendor:n.vendor||"", desc:(n.description||"").replace(/\s+/g," ").trim(),
          img:n.featuredImage?.url||"", price:n.priceRange?.minVariantPrice?.amount||"", inv: qty ? Math.max(0, n.totalInventory ?? variants.reduce((a,v)=>a+v.inv,0)) : (n.availableForSale ? 1 : 0), variants});
      }
      after = prods.pageInfo.hasNextPage ? prods.pageInfo.endCursor : null;
    } while (after && ++guard < 10);
    S.catalogo = {items, fetchedAt:Date.now(), source:"tienda", qty}; S.catStatus = "ok"; saveCatalog();
    if (!items.length){ S.catStatus = "error"; S.catError = "vacio"; }
  } catch (e) { console.error(e); S.catStatus = "error"; S.catError = e?.code || "red"; }
  renderIfStore();
}
function renderIfStore(){ if (S.view==="plan" || S.view==="proteinas") render(); if (S.supPick) renderSupPicker(); }
function catErrMsg(){
  const c = S.catError;
  if (c==="token") return "Shopify rechazó el token de Storefront. Revisa el token en config.js.";

  if (c==="red") return "No se pudo conectar con la tienda. Revisa tu internet e intenta de nuevo.";
  return "No se pudo leer el inventario de la tienda.";
}
const storeProduct = h => S.catalogo.items.find(p=>p.handle===h);
function stockOf(h){ const p = storeProduct(h); if (!p) return null; return Math.max(0, p.inv||0); }

/* ================= CÁLCULOS ================= */
function energia(pr){
  const peso=+pr.peso||0, talla=+pr.talla||0, edad=+pr.edad||0, gr=(+pr.grasa||0)/100;
  const mg = peso*gr, mlg = peso-mg, imc = talla ? peso/Math.pow(talla/100,2) : 0;
  const mif = 10*peso + 6.25*talla - 5*edad + (pr.sexo==="Masculino" ? 5 : -161);
  const katch = 370 + 21.6*mlg;
  const tmb = (pr.metodo==="Katch-McArdle" && gr>0) ? katch : mif;
  const get = tmb*(+pr.naf||1.2);
  const pct = +pr.objPct||0;
  const kcal = get*(1+pct);
  let alerta = "OK";
  if (kcal < tmb) alerta = "CRÍTICO: por debajo de la TMB"; else if (pct <= -.25) alerta = "AGRESIVO: vigila la masa magra"; else if (pct >= .2) alerta = "SUPERÁVIT ALTO: más ganancia de grasa";
  return {mg, mlg, imc, mif, katch, tmb, get, kcal, alerta};
}
function objetivosDia(plan){
  const e = energia(plan.params); const m = plan.macros; const peso = +plan.params.peso||1;
  const p = e.kcal*m.p/100/4, c = e.kcal*m.c/100/4, g = e.kcal*m.g/100/9;
  return {e, kcal:e.kcal, p, c, g, pkg:p/peso, ckg:c/peso, gkg:g/peso, suma:(+m.p)+(+m.c)+(+m.g)};
}
function calcItem(it){
  const f = F[it.c]; const z = {gCrudo:0,gCocido:0,k:0,p:0,ch:0,gr:0,f:0,fs:0,fi:0,food:f};
  if (!f) return z; const q = +it.q||0;
  const unit = f.m==="Unidad" || f.m==="Porcion";
  const g = unit ? q*(+f.pu||0) : (it.modo==="Cocido" ? q/(+f.fx||1) : q);
  const k = g/100;
  return {gCrudo:g, gCocido:g*(+f.fx||1), k:f.k*k, p:f.p*k, ch:f.ch*k, gr:f.gr*k, f:(f.f||0)*k, fs:(f.fs||0)*k, fi:(f.fi||0)*k, food:f};
}
function sumItems(items){
  const t = {k:0,p:0,ch:0,gr:0,f:0,fs:0,fi:0};
  for (const it of items){ const r = calcItem(it); for (const key in t) t[key] += r[key]; }
  return t;
}
function totalDia(plan){ return sumItems(plan.comidas.flatMap(c=>c.items)); }

/* Reparto por hora de entrenamiento */
function clasificaComidas(plan){
  const h = plan.horario || {}; const T = tmin(h.hora); const dur = +h.duracion||90;
  const meals = plan.comidas.map((c,i)=>({i, m:tmin(c.hora)}));
  const res = plan.comidas.map(()=>"normal");
  if (h.entrena!==false && T!=null){
    let pre=null, post=null;
    for (const x of meals){ if (x.m==null) continue; const d = x.m - T;
      if (d >= -210 && d <= -15 && (pre==null || x.m > meals[pre].m)) pre = x.i;
      if (x.m >= T+dur-20 && x.m <= T+dur+180 && (post==null || x.m < meals[post].m)) post = x.i; }
    if (pre!=null) res[pre] = "pre"; if (post!=null) res[post] = "post";
  }
  plan.comidas.forEach((c,i)=>{ if (c.tipo && c.tipo!=="auto") res[i] = c.tipo; });
  return res;
}
function absRecomendada(plan, i, tipos){
  const t = tipos[i]; const h = plan.horario||{}; const T = tmin(h.hora); const m = tmin(plan.comidas[i].hora);
  if (t==="pre"){ const d = (T!=null && m!=null) ? T-m : 90; return d <= 75 ? ["R","M"] : ["M","L"]; }
  if (t==="post") return ["R","M"];
  return ["L"];
}
function repartoAuto(plan){
  const tipos = clasificaComidas(plan); const n = plan.comidas.length; if (!n) return;
  const pre = tipos.indexOf("pre"), post = tipos.indexOf("post");
  const cPct = Array(n).fill(0), gPct = Array(n).fill(0), pPct = Array(n).fill(100/n);
  const special = [pre,post].filter(x=>x>=0);
  let cLeft = 100, gLeft = 100;
  if (pre>=0 && post>=0){ cPct[pre]=25; cPct[post]=30; gPct[pre]=8; gPct[post]=8; }
  else if (special.length===1){ cPct[special[0]]=30; gPct[special[0]]=8; }
  special.forEach(i=>{ cLeft -= cPct[i]; gLeft -= gPct[i]; });
  const others = [...Array(n).keys()].filter(i=>!special.includes(i));
  others.forEach(i=>{ cPct[i] = cLeft/others.length; gPct[i] = gLeft/others.length; });
  if (!others.length){ special.forEach(i=>{ cPct[i]=100/special.length; gPct[i]=100/special.length; }); }
  plan.comidas.forEach((c,i)=>{ c.reparto = {p:r1(pPct[i]), c:r1(cPct[i]), g:r1(gPct[i])}; });
}
function objetivoComida(plan, i){
  const o = objetivosDia(plan); const rp = plan.comidas[i].reparto || {p:0,c:0,g:0};
  return {p:o.p*rp.p/100, c:o.c*rp.c/100, g:o.g*rp.g/100};
}

/* Opción 1: calcular gramos para cerrar los macros de la comida */
function nnls(A, T, x, maxG){
  const PRIO=[2,1,.7], FLOOR=[15,20,8];
  const W = T.map((t,m)=>PRIO[m]/Math.pow(Math.max(t,FLOOR[m]),2));
  const lam = 3e-7;
  for (let it=0; it<800; it++){
    for (let j=0; j<x.length; j++){
      let num=0, den=lam;
      for (let m=0; m<3; m++){
        let r = -T[m]; for (let k=0; k<x.length; k++) if (k!==j) r += A[k][m]*x[k];
        num -= W[m]*A[j][m]*r; den += W[m]*A[j][m]*A[j][m];
      }
      x[j] = Math.min(maxG[j], Math.max(0, num/den));
    }
  }
  return x;
}
function resolverComida(plan, i){
  const meal = plan.comidas[i]; const tgt = objetivoComida(plan, i);
  const adj = it => !it.lock && F[it.c] && ADJ_GROUPS.has(F[it.c].g);
  const free = meal.items.filter(adj);
  if (!free.length) return "No hay alimentos ajustables en esta comida. Agrega una proteína, un carbohidrato o una grasa, o quita el candado.";
  const solve = list => {
    const fixed = sumItems(meal.items.filter(it=>!list.includes(it)));
    const T = [Math.max(0,tgt.p-fixed.p), Math.max(0,tgt.c-fixed.ch), Math.max(0,tgt.g-fixed.gr)];
    const A = list.map(it => { const f=F[it.c]; return [f.p/100, f.ch/100, f.gr/100]; });
    const maxG = list.map(it => { const f=F[it.c]; return f.m==="Porcion" ? f.pu*3 : f.m==="Unidad" ? f.pu*8 : (f.g.startsWith("Grasa") ? 120 : 600); });
    const x0 = list.map(it => { const g = calcItem(it).gCrudo; return g>0 ? g : 40; });
    return nnls(A, T, x0, maxG);
  };
  const setQ = (it, g) => { const f = F[it.c];
    if (f.m==="Porcion"){ it.q = Math.max(0, Math.round(g/f.pu*2)/2); it.modo="Crudo"; }
    else if (f.m==="Unidad"){ it.q = Math.max(0, Math.round(g/f.pu)); it.modo="Crudo"; }
    else if (it.modo==="Cocido" && f.fx!==1){ it.q = Math.round(g*f.fx/5)*5; }
    else it.q = Math.round(g/5)*5; };
  // 1) solución continua; 2) se redondean porciones y unidades; 3) se recalculan los alimentos en gramos
  const x = solve(free);
  const discretos = free.filter(it=>["Porcion","Unidad"].includes(F[it.c].m));
  const gramos = free.filter(it=>!discretos.includes(it));
  discretos.forEach(it => setQ(it, x[free.indexOf(it)]));
  if (gramos.length){ const x2 = solve(gramos); gramos.forEach((it,j)=>setQ(it, x2[j])); }
  const zeros = free.filter(it=>!(+it.q)).map(it=>F[it.c].n);
  const s = sumItems(meal.items); const notas = [];
  if (tgt.p>5 && s.p < tgt.p*.85) notas.push("Falta proteína: agrega una fuente magra (pechuga, clara, atún en agua o una proteína de la tienda).");
  if (tgt.g>0 && s.gr > tgt.g*1.3 + 2) notas.push("La grasa se pasa: cambia por una proteína más magra o reduce la grasa añadida.");
  if (tgt.c>5 && s.ch < tgt.c*.85) notas.push("Faltan carbohidratos: agrega otra fuente de carbohidratos.");
  if (zeros.length) notas.unshift(`El cálculo no necesitó: ${zeros.join(", ")}. Puedes quitarlo o fijarlo con el candado.`);
  return notas.length ? notas.join(" ") : null;
}

/* Opción 5: equivalencias */
function claseEq(f){
  if (!f) return null;
  if (f.g==="Proteína en polvo") return "polvo";
  if (f.g==="Ganador de peso") return null;
  if (f.g==="Carbohidrato" && (f.s==="Fruta" || f.s==="Fruta seca")) return "fruta";
  if (f.g==="Proteina/Carbohidrato") return "leg";
  if (f.g==="Carbohidrato" && f.s!=="Endulzante") return "carb";
  if (f.g==="Proteina" || f.g==="Proteina/Grasa") return (f.s||"").startsWith("Lacteo") && f.p < 8 ? null : "prot";
  if (f.g==="Grasa") return "grasa";
  return null;
}
const MAIN = {carb:"ch", fruta:"ch", leg:"ch", prot:"p", polvo:"p", grasa:"gr"};
const MIN100 = {carb:12, fruta:6, leg:20, prot:9, polvo:50, grasa:25};
function equivalencias(it, blocked, n=3){
  const f = F[it.c]; const cl = claseEq(f); if (!cl) return [];
  const r = calcItem(it); const key = MAIN[cl]; const M = r[key]; if (!(M>0.5)) return [];
  const cooked = it.modo==="Cocido";
  const out = [];
  for (const c of FOODS){
    if (c.c===f.c || blocked.has(c.c) || claseEq(c)!==cl || !(c[key] >= MIN100[cl])) continue;
    if (["Frito","Galleta"].includes(c.s) || c.g==="Bebida") continue;
    if (cl==="prot" && c.s===f.s && norm(c.n).split(" ")[0]===norm(f.n).split(" ")[0]) continue;
    const g = M/(c[key]/100); if (g > 450 || g < 5) continue;
    const kc = c.k*g/100;
    let score = Math.abs(kc - r.k)/Math.max(r.k,1);
    if (cl==="carb"){ if (c.a!==f.a) score += .45; if (c.s===f.s) score -= .15; if (c.m==="Unidad") score += .3; }
    if (cl==="prot"){ score += Math.abs(c.gr*g/100 - r.gr)/20; if (c.s===f.s) score -= .1; }
    if (cl==="polvo"){ const st = stockOf(c.h); if (st===0) score += 2; }
    out.push({c:c.c, n:c.n, g, kc, score, cocido: cooked && c.fx!==1, gShow: cooked && c.fx!==1 ? g*c.fx : g});
  }
  out.sort((a,b)=>a.score-b.score);
  return out.slice(0,n);
}
function textoCantidad(it){
  const r = calcItem(it); const f = r.food; if (!f) return "";
  if (f.fx && f.fx!==1){
    return it.modo==="Cocido" ? `${fmt(r.gCocido)} g cocido (${fmt(r.gCrudo)} g crudo)` : `${fmt(r.gCrudo)} g crudo (aprox. ${fmt(r.gCocido)} g cocido)`;
  }
  return `${fmt(r.gCrudo)} g`;
}

/* Opción 6: observación para el día sin entrenamiento */
function obsDescanso(plan){
  const tipos = clasificaComidas(plan); const pct = +plan.params.objPct||0;
  const idx = tipos.map((t,i)=>t==="pre"||t==="post"?i:-1).filter(i=>i>=0);
  const nombres = idx.map(i=>plan.comidas[i].nombre.toLowerCase());
  const cpp = idx.reduce((s,i)=>s+sumItems(plan.comidas[i].items).ch, 0);
  const lista = nombres.length ? nombres.join(" y ") : "las comidas que rodean el entrenamiento";
  if (!idx.length || cpp < 5) {
    return pct < 0 ? "Los días que no entrenes, baja a la mitad la porción de carbohidratos de la comida más cercana a tu hora habitual de entrenamiento y mantén igual la proteína." :
      "Los días que no entrenes puedes mantener el mismo plan. Prioriza carbohidratos de absorción lenta.";
  }
  if (pct < 0 || plan.params.objetivo==="Recomposición"){
    const red = pct < 0 ? .5 : .3;
    return `Los días que no entrenes, reduce ${Math.round(red*100)}% los carbohidratos de ${lista} (unos ${fmt(cpp*red)} g menos, aprox. ${fmt(cpp*red*4)} kcal). Cambia los carbohidratos rápidos por vegetales y mantén la proteína igual.`;
  }
  if (pct === 0){
    return `Los días que no entrenes, reduce 30% los carbohidratos de ${lista} (unos ${fmt(cpp*.3)} g menos) y puedes sumar ${fmt(cpp*.3*4/9)} g de grasa saludable (aguacate, aceite de oliva o frutos secos) para mantener las calorías. La proteína se mantiene igual.`;
  }
  return `Los días que no entrenes no bajes las calorías: tu objetivo es ganar masa. Mueve los carbohidratos de ${lista} a las otras comidas del día y elige opciones de absorción lenta (avena, arroz integral, batata, legumbres).`;
}

/* Bloqueos por cliente */
function tagsBloqueados(cl){
  const t = new Set(Array.isArray(cl.alergias) ? cl.alergias : []);
  for (const x of (Object.hasOwn(DIETA_TAGS, cl.dieta) ? DIETA_TAGS[cl.dieta] : [])) t.add(x);
  return t;
}
function bloqueos(cl){
  const map = new Map(); if (!cl) return map;
  const tags = tagsBloqueados(cl); const des = new Set(Array.isArray(cl.desbloqueados) ? cl.desbloqueados : []);
  for (const f of FOODS){
    const hit = (f.t||[]).filter(x=>tags.has(x));
    if (hit.length && !des.has(f.c)) map.set(f.c, hit.map(x=>ALERG[x]||DIETAS_TAG_LABEL(x)).join(", "));
  }
  for (const c of (Array.isArray(cl.noMeGusta) ? cl.noMeGusta : [])) if (F[c] && !des.has(c)) map.set(c, map.has(c) ? map.get(c)+", no le gusta" : "No le gusta");
  for (const c of (Array.isArray(cl.bloqueadosManual) ? cl.bloqueadosManual : [])) if (F[c]) map.set(c, map.get(c) || "Bloqueado por ti");
  return map;
}
function DIETAS_TAG_LABEL(t){ return {carne:"Dieta: carnes",cerdo:"Dieta: cerdo",lacteo:"Dieta: lácteos",miel:"Dieta: miel"}[t] || t; }

/* Lista de compras */
function listaCompras(plan){
  const acc = new Map();
  for (const c of plan.comidas) for (const it of c.items){
    const r = calcItem(it); if (!r.food || !(r.gCrudo>0)) continue;
    const a = acc.get(it.c) || {food:r.food, g:0}; a.g += r.gCrudo; acc.set(it.c, a);
  }
  const grupos = {};
  const gname = f => f.g==="Proteína en polvo"||f.g==="Ganador de peso" ? "Suplementos" : f.s==="Fruta"||f.s==="Fruta seca" ? "Frutas" : f.g==="Vegetal" ? "Vegetales" : f.g.startsWith("Proteina") ? "Proteínas" : f.g.startsWith("Carbohidrato") ? "Carbohidratos" : f.g.startsWith("Grasa") ? "Grasas" : "Otros";
  for (const {food, g} of acc.values()){
    if (food.k===0 && food.g==="Bebida") continue;
    const sem = g*7; const gr = sem<50 ? Math.ceil(sem/10)*10 : Math.ceil(sem/50)*50;
    (grupos[gname(food)] ||= []).push({n:food.n, g:gr, porc: food.m==="Porcion" ? Math.ceil(sem/food.pu) : null});
  }
  return grupos;
}

const sum8 = k => { const v = ISAK_PL.map(([x])=>+(k.pliegues?.[x])||0); return v.some(Boolean) ? v.reduce((a,b)=>a+b,0) : 0; };
function vChart(list){
  const metric = S.chartMetric || "peso";
  const pts = [...list].reverse().map(k=>({f:k.fecha, v: metric==="sum8" ? sum8(k) : +k[metric]})).filter(p=>p.v>0);
  const opts = [["peso","Peso (kg)"],["grasaPct","% grasa"],["masaMusc","Masa muscular (kg)"],["sum8","Σ 8 pliegues (mm)"]];
  let svg = `<p class="muted">No hay suficientes datos de esta medida.</p>`;
  if (pts.length>=2){
    const W=640,H=220,pl=44,pr=16,pt=14,pb=30;
    let mn=Math.min(...pts.map(p=>p.v)), mx=Math.max(...pts.map(p=>p.v)); const pad=(mx-mn)*.15||1; mn-=pad; mx+=pad;
    const x=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
    const ticks=[0,.5,1].map(t=>mn+(mx-mn)*t);
    const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");

    svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">

      <polygon points="${area}" fill="var(--brand)" fill-opacity=".10"/>
      <polyline points="${line}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"var(--brand)":"var(--surface)"}" stroke="var(--brand)" stroke-width="2"/>
        <text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${fdate(p.f).slice(0,5)}</text>`).join("")}
      <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].v)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${fmt(pts[pts.length-1].v,1)}</text>
    </svg>`;
    const d = pts[pts.length-1].v - pts[0].v;
    svg += `<p class="small muted" style="margin:0">Cambio desde el primer control: <b style="color:var(--ink)">${d>0?"+":""}${fmt(d,1)}</b></p>`;
  }
  return `<div class="chips">${opts.map(([k,l])=>`<button class="chip" aria-pressed="${metric===k}" data-act="chart" data-k="${k}">${l}</button>`).join("")}</div><div class="chart">${svg}</div>`;
}

  return `<div class="panel">

  </div>
  <div class="panel">
    <h3>Balance de fibra</h3>

function bar(val, tgt, color){
  const pct = tgt>0 ? Math.min(130, val/tgt*100) : 0; const ok = tgt>0 && Math.abs(val-tgt)/tgt<=.05;
  return `<div class="track"><div class="fill" style="width:${Math.min(100,pct)}%;background:${pct>105?"var(--bad)":ok?"var(--ok)":color}"></div></div>`;
}
function vMeal(p,c,i,tipos,bl){

      <button class="btn sm" data-act="load-tpl" data-meal="${i}">Plantilla</button>

        <div class="tbar"><span><b style="color:var(--mg)">G</b> ${fmt(s.gr)} / ${fmt(t.g)} g</span>${bar(s.gr,t.g,"var(--mg)")}</div>
      </div>
      ${c.items.length ? `<div class="tbl-wrap"><table class="items"><thead><tr><th>Alimento</th><th class="n">Cantidad</th><th>Modo</th><th class="n">g crudo</th><th class="n">g cocido</th><th class="n">kcal</th><th class="n">P</th><th class="n">C</th><th class="n">G</th><th></th></tr></thead><tbody>
        ${c.items.map((it,j)=>{ const r = calcItem(it); const f = r.food; if (!f) return "";

          <td class="n">${fmt(r.gCrudo)}</td><td class="n">${f.fx!==1?fmt(r.gCocido):"–"}</td>

          <td class="n"><div class="row" style="flex-wrap:nowrap;gap:4px;justify-content:flex-end"><label class="lock" title="Fijar cantidad: el cálculo automático no la cambia"><input type="checkbox" id="lk-${i}-${j}" ${it.lock?"checked":""}>Fijar</label><button class="btn sm icon" data-act="del-item" data-meal="${i}" data-j="${j}" aria-label="Quitar">✕</button></div></td></tr>

}

function defaultMomento(type){
  const t = norm(type);
  if (t.includes("pre entreno")) return "Pre entreno";
  if (t.includes("proteina") || t.includes("creatina") || t.includes("ganador")) return "Post entreno";
  if (t.includes("magnesio") || t.includes("adaptogeno")) return "Antes de dormir";
  if (t.includes("quemador")) return "Al despertar (en ayunas)";
  if (t.includes("multivit") || t.includes("salud") || t.includes("mineral")) return "Con el desayuno";
  return "Con cualquier comida";
}

function importar(txt){

  if (!m){ msg.textContent = "No encontré el código de la entrevista. Copia el mensaje completo, incluido lo que está entre [[ ]]."; msg.style.color = "var(--bad)"; return; }
  let d; try { const bin = atob(m[1].replace(/\s/g,"")); d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch=>ch.charCodeAt(0)))); }
  catch { msg.textContent = "El código está incompleto o dañado. Pídele al cliente que lo envíe otra vez."; msg.style.color = "var(--bad)"; return; }
  S.pendingImport = d;
  const match = S.clientes.find(c => (digits(c.telefono) && digits(c.telefono)===digits(d.telefono)) || norm(c.nombre)===norm(d.nombre));
  if (match){

}

async function aplicarEntrevista(d, isak, pdfPath, cuando, forzarId, eid){

    await cargarCliente(base.id);
    const limpio = Object.fromEntries(Object.entries(f).filter(([k,v]) => v!=="" && v!=null && !(Array.isArray(v) && !v.length) && !(k==="nombre" && v==="Cliente sin nombre")));
    c = {...base, ...limpio};
    c.alergias = [...new Set([...(Array.isArray(base.alergias)?base.alergias:[]), ...f.alergias])];
    c.noMeGusta = [...new Set([...(Array.isArray(base.noMeGusta)?base.noMeGusta:[]), ...f.noMeGusta])];
    if (base.nafManual) c.naf = base.naf;
    c.notas = base.notas; c.bloqueadosManual = base.bloqueadosManual; c.desbloqueados = base.desbloqueados;
  } else {
    c = nuevoCliente({...f, id: eid ? "c_"+eid : newId("c")});
    if (forzarId === undefined){ const mismo = [...DB.clientes.values()].find(x => x.id!==c.id && norm(x.nombre)===norm(c.nombre)); if (mismo) c.posibleDuplicadoDe = mismo.id; }
    LOADED.add(c.id);
  }
  if (isak && isak.valido){ if (!c.sexo && isak.sexo) c.sexo = isak.sexo; if (!c.talla && isak.talla) c.talla = isak.talla; }
  await saveCliente(c);
  const subido = cuando || new Date().toISOString();
  if (isak && isak.valido){ const k = controlDesdeIsak(isak, c.id, pdfPath); if (eid) k.id = "k_"+eid; k.subido = subido; await guardarControlIsak(k); }

  if (pdfPath) await dejarSoloUltimoPDF(c.id);
  return c;
}

  boxes.forEach((b,i)=>{ const x = 10 + i*(bw+3); doc.setFillColor(...PDFC.soft); doc.roundedRect(x,y,bw,19,2,2,"F");
    doc.setFontSize(8); doc.setTextColor(...PDFC.muted); doc.text(b[0].toUpperCase(), x+4, y+5.5);
    doc.setFontSize(14); doc.setFont("helvetica","bold"); doc.setTextColor(...PDFC.brand); doc.text(b[1], x+4, y+12.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...PDFC.muted); doc.text(b[2], x+4, y+17); });
  y += 24;
  doc.setFontSize(9.5); doc.setTextColor(...PDFC.ink);
  const sub = [`Objetivo: ${plan.params.objetivo}`, plan.horario?.entrena!==false && plan.horario?.hora ? `Entrenamiento: ${plan.horario.hora}` : null, `Comidas: ${plan.comidas.length}`].filter(Boolean).join("   |   ");
  doc.text(sub, 10, y); y += 6;
  doc.setFontSize(8); doc.setTextColor(...PDFC.muted); doc.text("Las cantidades son en gramos. Pesa los alimentos en crudo siempre que puedas; el peso cocido es aproximado.", 10, y); y += 4;

  plan.comidas.forEach((c,i)=>{
    const items = c.items.filter(it=>F[it.c] && (+it.q)>0); if (!items.length) return;
    const s = sumItems(items);
    y = ensureSpace(doc, y, 30);
    y += 4;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...PDFC.brand);
    doc.text(`${c.nombre.toUpperCase()}${c.hora?"  ·  "+c.hora:""}`, 10, y);
    const tag = tipos[i]==="pre" ? "PRE ENTRENO" : tipos[i]==="post" ? "POST ENTRENO" : "";
    if (tag){ doc.setFontSize(8); const tw = doc.getTextWidth(tag)+6; const tx = W-10-tw; doc.setFillColor(...PDFC.cyan); doc.roundedRect(tx, y-4, tw, 5.5, 1.5, 1.5, "F"); doc.setTextColor(255,255,255); doc.text(tag, tx+3, y); }
    doc.setFont("helvetica","normal"); y += 2;
    const body = items.map(it=>{ const r = calcItem(it); return [r.food.n, textoCantidad(it), fmt(r.k), fmt(r.p,1), fmt(r.ch,1), fmt(r.gr,1)]; });
    doc.autoTable({ startY:y, margin:{left:10,right:10}, head:[["Alimento","Cantidad","kcal","Prot.","Carb.","Grasa"]], body,
      foot:[["Total de la comida","",fmt(s.k),fmt(s.p,1),fmt(s.ch,1),fmt(s.gr,1)]],
      styles:{font:"helvetica", fontSize:9, cellPadding:1.8, textColor:PDFC.ink, lineColor:PDFC.line, lineWidth:0.1},
      headStyles:{fillColor:PDFC.brand, textColor:255, fontStyle:"bold"}, footStyles:{fillColor:PDFC.soft, textColor:PDFC.ink, fontStyle:"bold"},
      columnStyles:{0:{cellWidth:62},1:{cellWidth:58},2:{halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"}},
      didParseCell: d => { if ((d.section==="head"||d.section==="foot") && d.column.index>=2) d.cell.styles.halign = "right"; } });
    y = doc.lastAutoTable.finalY + 2;
    // enlaces de proteínas de la tienda
    items.forEach(it=>{ const f = F[it.c]; if (!f.h) return; y = ensureSpace(doc, y, 6); doc.setFontSize(8.5); doc.setTextColor(...PDFC.brand);
      doc.textWithLink(`Comprar ${f.n} en enelmusculo.com`, 12, y+3, {url: STORE+f.h}); y += 5; });
    if (plan.equivalencias!==false){
      const lines = [];
      items.forEach(it=>{ const e = equivalencias(it, bl); if (!e.length) return;
        const r = calcItem(it); const base = it.modo==="Cocido" ? `${fmt(r.gCocido)} g de ${r.food.n} (cocido)` : `${fmt(r.gCrudo)} g de ${r.food.n}`;
        lines.push(`${base} = ` + e.map(x=>`${fmt(Math.round(x.gShow/5)*5)} g de ${x.n}${x.cocido?" (cocido)":""}`).join("  o  ")); });
      if (lines.length){
        doc.setFontSize(8.3); const wrapped = lines.flatMap(l=>doc.splitTextToSize("• "+l, W-26));
        y = ensureSpace(doc, y, 6 + wrapped.length*3.6);
        doc.setFont("helvetica","bold"); doc.setTextColor(...PDFC.muted); doc.text("Si no tienes alguno, puedes cambiarlo por:", 12, y+3); y += 6.5;
        doc.setFont("helvetica","normal"); doc.setTextColor(...PDFC.ink);
        wrapped.forEach(l=>{ y = ensureSpace(doc, y, 4); doc.text(l, 14, y); y += 3.6; });
      }
    }
  });
  // Total del día
  y = ensureSpace(doc, y, 40); y += 5;
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...PDFC.brand); doc.text("TOTAL DEL DÍA", 10, y); y += 2;
  doc.autoTable({ startY:y, margin:{left:10,right:10}, head:[["","Calorías","Proteína","Carbohidratos","Grasas","Fibra"]],
    body:[["Tu plan", fmt(t.k)+" kcal", fmt(t.p)+" g", fmt(t.ch)+" g", fmt(t.gr)+" g", fmt(t.f,1)+" g"],["Por kg de peso","", fmt(t.p/peso,2)+" g/kg", fmt(t.ch/peso,2)+" g/kg", fmt(t.gr/peso,2)+" g/kg",""]],
    styles:{fontSize:9, cellPadding:1.8, lineColor:PDFC.line, lineWidth:0.1, textColor:PDFC.ink}, headStyles:{fillColor:PDFC.brand, textColor:255} });
  y = doc.lastAutoTable.finalY + 6;
  const bloque = (titulo, texto) => {
    if (!texto || !texto.trim()) return;
    doc.setFontSize(9.5); const lines = doc.splitTextToSize(texto.trim(), W-28);
    const h = 9 + lines.length*4.4; y = ensureSpace(doc, y, h+4);
    doc.setFillColor(...PDFC.soft); doc.roundedRect(10, y, W-20, h, 2, 2, "F"); doc.setFillColor(...PDFC.cyan); doc.rect(10, y, 1.6, h, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...PDFC.brand); doc.text(titulo, 15, y+6);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...PDFC.ink); doc.text(lines, 15, y+11.5);
    y += h + 5;
  };
  if (plan.horario?.entrena!==false) bloque("Los días que no entrenes", plan.obsDescanso);
  bloque("Indicaciones", plan.indicaciones);
  if ((plan.suplementos||[]).length) bloque("Suplementación", `Tu guía de suplementación viene en un documento aparte, con el enlace para comprar cada producto.`);
  // Lista de compras
  if (plan.listaCompras){
    doc.addPage(); let yy = 18;
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(...PDFC.brand); doc.text("LISTA DE COMPRAS SEMANAL", 10, yy); yy += 5;
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...PDFC.muted); doc.text("Cantidades en peso crudo para 7 días, redondeadas hacia arriba.", 10, yy); yy += 3;
    const g = listaCompras(plan);
    const order = ["Proteínas","Carbohidratos","Frutas","Vegetales","Grasas","Suplementos","Otros"];
    const body = []; order.forEach(k=>{ if (!g[k]) return; body.push([{content:k.toUpperCase(), colSpan:2, styles:{fillColor:PDFC.soft, fontStyle:"bold", textColor:PDFC.brand}}]);
      g[k].sort((a,b)=>a.n.localeCompare(b.n)).forEach(x=>body.push(["[  ]  "+x.n, x.g>=1000 ? fmt(x.g/1000,2)+" kg" : fmt(x.g)+" g" + (x.porc?` (${x.porc} porciones)`:"")])); });
    doc.autoTable({ startY:yy+2, margin:{left:10,right:10}, body, styles:{fontSize:9.5, cellPadding:2, lineColor:PDFC.line, lineWidth:0.1, textColor:PDFC.ink}, columnStyles:{1:{halign:"right", cellWidth:50}} });
  }
  pdfFooter(doc);
  guardarPDF(doc, `Plan de alimentación - ${cl.nombre||"cliente"} - ${fdate(plan.fecha).replace(/\//g,"-")}.pdf`);
}
function pdfSupl(plan){
  const items = plan.suplementos||[]; if (!items.length) return;
  const doc = pdfBase("GUÍA DE SUPLEMENTACIÓN", plan); if (!doc) return;
  const W = doc.internal.pageSize.getWidth(); const cl = cliente()||{};
  const tipos = clasificaComidas(plan); const hora = n => { const i = plan.comidas.findIndex(c=>norm(c.nombre).includes(n)); return i>=0 ? plan.comidas[i].hora : ""; };
  const pre = plan.comidas[tipos.indexOf("pre")]?.hora || (plan.horario?.hora ? mtime(tmin(plan.horario.hora)-30) : "");
  const post = plan.comidas[tipos.indexOf("post")]?.hora || "";
  const horaDe = m => ({ "Pre entreno":pre, "Post entreno":post, "Durante el entreno":plan.horario?.hora||"", "Con el desayuno":hora("desayuno"), "Con el almuerzo":hora("almuerzo"), "Con la merienda":hora("merienda"), "Con la cena":hora("cena"), "Al despertar (en ayunas)":(cl.despertar||""), "Antes de dormir":(cl.dormir?mtime(tmin(cl.dormir)-30):"") }[m] || "");
  let y = 40;
  doc.setFontSize(9.5); doc.setTextColor(...PDFC.ink);
  doc.text(doc.splitTextToSize("Estos son los suplementos que te recomiendo para acompañar tu plan. Toca el nombre de cada uno para comprarlo directo en la tienda.", W-20), 10, y); y += 10;
  const ordenM = m => MOMENTOS.indexOf(m);
  const sorted = [...items].sort((a,b)=>ordenM(a.momento)-ordenM(b.momento));
  sorted.forEach(s=>{
    doc.setFontSize(9.5); const nota = s.nota ? doc.splitTextToSize(s.nota, W-34) : [];
    const h = 22 + nota.length*4.2; y = ensureSpace(doc, y, h+4);
    doc.setDrawColor(...PDFC.line); doc.setFillColor(255,255,255); doc.roundedRect(10, y, W-20, h, 2, 2, "FD");
    doc.setFillColor(...PDFC.brand); doc.rect(10, y, 1.8, h, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...PDFC.brand);
    doc.textWithLink(s.title + (s.variantTitle?` - ${s.variantTitle}`:""), 16, y+7, {url:s.url});
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...PDFC.ink);
    const hh = horaDe(s.momento);
    doc.text(`Dosis: ${s.dosis || "según la etiqueta"}`, 16, y+13);
    doc.text(`Cuándo: ${s.momento}${hh?` (aprox. ${hh})`:""}`, 90, y+13);
    if (nota.length){ doc.setTextColor(...PDFC.muted); doc.text(nota, 16, y+18.5); }
    doc.setFontSize(8.5); doc.setTextColor(...PDFC.cyan); doc.textWithLink("Comprar en enelmusculo.com  >", 16, y+h-3, {url:s.url});
    y += h + 4;
  });
  y = ensureSpace(doc, y, 18);
  doc.setFontSize(8); doc.setTextColor(...PDFC.muted);
  doc.text(doc.splitTextToSize("Si tienes alguna condición médica, estás embarazada o tomas medicamentos, consulta con tu médico antes de empezar cualquier suplemento. Disponibilidad sujeta al inventario de la tienda.", W-20), 10, y+4);
  pdfFooter(doc);
  guardarPDF(doc, `Guía de suplementación - ${cl.nombre||"cliente"} - ${fdate(plan.fecha).replace(/\//g,"-")}.pdf`);
}

document.body.insertAdjacentHTML("beforeend", `<datalist id="mealnames">${MEAL_NAMES.map(n=>`<option value="${n}">`).join("")}</datalist>`);
document.addEventListener("keydown", e => { if (e.key==="Escape" && $("#modal").innerHTML && !S.conflicto) closeModal(); });
render();
document.addEventListener("submit", async e => {
  if (e.target.id !== "login") return; e.preventDefault();
  const email = $("#l-email").value.trim(), password = $("#l-pass").value;
  S.loginEmail = email;
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Entrando…";
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if (error){ S.authMsg = /Invalid login/i.test(error.message) ? "Correo o contraseña incorrectos." : /fetch/i.test(error.message) ? "Sin conexión a internet." : error.message; render(); return; }
  S.authMsg = ""; await iniciarSesion(data.user);
});
async function iniciarSesion(user){
  S.user = user; S.storage = "cargando"; render();
  try { await cargarTodo(); S.storage = "ok"; }
  catch (e) { console.error(e); S.storage = "ok"; toast("No se pudieron cargar tus datos. Revisa tu conexión y recarga.", 6000); }
  render();
  suscribirCambios(); await procesarEntrevistas(); await cargarRecibidas(); render();
  if (SHOP_OK) loadCatalog(false);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState==="hidden"){ flushPlan(); flushFichas(); }
  else if (S.user){ sincronizar(); procesarEntrevistas(); reintentar(); }
});
window.addEventListener("pagehide", () => { flushPlan(); flushFichas(); });
window.addEventListener("online", () => { if (S.user){ reintentar(); sincronizar(); } });
setInterval(() => { if (S.user && document.visibilityState==="visible"){ procesarEntrevistas(); reintentar(); } }, 60000);
setInterval(() => { if (S.user && PEND.size) reintentar(); }, 20000);
(async () => {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  try { const c = JSON.parse(localStorage.getItem("eem-catalogo")||"null"); if (c && c.items) { S.catalogo = c; S.catalogo.source = "guardado"; } } catch {}
  if (!CONFIGURADO || !sb){ S.storage = "sin-config"; render(); return; }
  const {data} = await sb.auth.getSession();
  if (data?.session?.user) await iniciarSesion(data.session.user);
  else { S.storage = "listo"; render(); }
  sb.auth.onAuthStateChange((ev, session) => { if (ev==="SIGNED_OUT"){ S.user = null; render(); } });
})();
